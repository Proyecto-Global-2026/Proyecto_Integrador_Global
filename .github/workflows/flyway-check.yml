name: Flyway Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: proyecto_global
          POSTGRES_USER: flyway
          POSTGRES_PASSWORD: flyway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyway -d proyecto_global"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/proyecto_global
      FLYWAY_USER: flyway
      FLYWAY_PASSWORD: flyway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/proyecto.global/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:12 \
            -url="$FLYWAY_URL" \
            -user="$FLYWAY_USER" \
            -password="$FLYWAY_PASSWORD" \
            -locations=filesystem:/flyway/sql \
            -schemas=proyecto_global \
            -defaultSchema=proyecto_global \
            -createSchemas=true \
            -connectRetries=10 \
            migrate

      - name: Show migration status
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/proyecto.global/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:12 \
            -url="$FLYWAY_URL" \
            -user="$FLYWAY_USER" \
            -password="$FLYWAY_PASSWORD" \
            -locations=filesystem:/flyway/sql \
            -schemas=proyecto_global \
            info

      - name: Verify applied migrations
        run: |
          APPLIED=$(docker run --rm --network host -e PGPASSWORD="$FLYWAY_PASSWORD" postgres:16 \
            psql -h 127.0.0.1 -U "$FLYWAY_USER" -d proyecto_global -tAc \
            "SELECT COUNT(*) FROM proyecto_global.flyway_schema_history WHERE success = true")
          FILES=$(ls proyecto.global/src/main/resources/db/migration/*.sql | wc -l)
          echo "Migrations applied: $APPLIED"
          echo "Migration files:   $FILES"
          [ "$APPLIED" -eq "$FILES" ]

      - name: List created tables
        run: |
          docker run --rm --network host -e PGPASSWORD="$FLYWAY_PASSWORD" postgres:16 \
            psql -h 127.0.0.1 -U "$FLYWAY_USER" -d proyecto_global -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema = 'proyecto_global' ORDER BY table_name;"
