# =====================================================================
# Configuracion general
# =====================================================================
spring.application.name=proyecto-global

# =====================================================================
# Carga del archivo .env
# Spring no lee .env de forma nativa, con este import se cargan las
# variables del archivo .env como si fueran variables de entorno.
# El formato KEY=VALUE es compatible con .properties.
# =====================================================================
spring.config.import=optional:file:.env[.properties]

# =====================================================================
# Base de datos - PostgreSQL
# Sobrescribible por variables de entorno para no depender de este archivo
# (DB_URL, DB_USER, DB_PASSWORD).
#
# Nota: en este servidor el schema "public" es propiedad de postgres y el
# usuario de la aplicacion no tiene permisos sobre el, por eso el proyecto
# usa su propio schema (proyecto_global), que Flyway crea en el primer
# arranque.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://q39zw9.h.filess.io:5432/Proyecto_Global_pickstrip?currentSchema=proyecto_global}
spring.datasource.username=${DB_USER:Proyecto_Global_pickstrip}
spring.datasource.password=${DB_PASSWORD:cbdbe8081bedc46ee39a2f7801c52ca3cff83c49}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.pool-name=ProyectoGlobalPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:900000}

# =====================================================================
# Spring Data JPA / Hibernate
# El esquema lo administra Flyway, por eso ddl-auto nunca crea tablas.
# =====================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=proyecto_global
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =====================================================================
# Flyway - migraciones de esquema
# El schema public de este servidor no es accesible para el usuario de la
# aplicacion, por eso el proyecto usa su propio schema y Flyway lo crea
# en el primer arranque.
# =====================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=proyecto_global
spring.flyway.default-schema=proyecto_global
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# =====================================================================
# Servidor
# =====================================================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# =====================================================================
# Seguridad de transporte (S3-05)
#
# TLS 1.3 obligatorio cuando el backend publica HTTPS directamente. Si el
# TLS lo termina un proxy o balanceador, dejar SSL_ENABLED=false y activar
# FORWARD_HEADERS_STRATEGY=native para que Spring conozca el esquema real.
# =====================================================================
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
# Certificado y llave se toman de SERVER_SSL_CERTIFICATE y
# SERVER_SSL_CERTIFICATE_PRIVATE_KEY (mapeo estandar de Spring Boot).

# Cookies de sesion (flujo OAuth2). La API se autentica con JWT en la
# cabecera Authorization, pero cuando existe sesion de servidor la cookie
# viaja solo por HTTPS, no es accesible desde JavaScript y no se envia en
# navegaciones cruzadas. En desarrollo local por HTTP se puede usar
# SESSION_COOKIE_SECURE=false.
server.servlet.session.cookie.name=UTNGSESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

# =====================================================================
# Archivos adjuntos (S1-11)
# El limite del contenedor va un poco por encima del limite de negocio
# para que el servicio pueda responder 422 con mensaje claro.
# =====================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB

app.storage.max-tamano-bytes=10485760
app.storage.local.directorio=${STORAGE_DIR:uploads/planeaciones}

# =====================================================================
# Swagger / OpenAPI
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html

# =====================================================================
# JWT
# =====================================================================
app.jwt.secret=${JWT_SECRET:camBIaEstaClaveDeDesarrolloDecepcion1111111111111111}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# =====================================================================
# CORS - origenes del frontend
# =====================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.exposed-headers=Location,Content-Disposition
app.cors.allow-credentials=true
app.cors.max-age=3600

# =====================================================================
# Logging
# =====================================================================
logging.level.root=INFO
logging.level.com.example.proyecto.global=${APP_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:OFF}
logging.level.org.flywaydb=INFO

# =====================================================================
# Notificaciones por correo (S3-01)
# Integracion con SendGrid (API HTTP v3). Se deja deshabilitada por
# defecto para que el entorno de desarrollo funcione sin credenciales.
# En produccion: NOTIFICACIONES_HABILITADO=true y SENDGRID_API_KEY=<key>.
# =====================================================================
app.notificaciones.habilitado=${NOTIFICACIONES_HABILITADO:false}
app.notificaciones.sendgrid-api-key=${SENDGRID_API_KEY:}opencode
app.notificaciones.remitente-email=${NOTIFICACIONES_REMITENTE:no-reply@proyecto-global.local}
app.notificaciones.remitente-nombre=${NOTIFICACIONES_REMITENTE_NOMBRE:Proyecto Global}
app.notificaciones.url-sendgrid=${SENDGRID_URL:https://api.sendgrid.com/v3/mail/send}

# =====================================================================
# Almacenamiento de archivos (S3-02)
# =====================================================================
app.storage.proveedor=${STORAGE_PROVEEDOR:local}
app.storage.max-tamano-bytes=10485760
app.storage.extensiones-permitidas=pdf,doc,docx,xls,xlsx,ppt,pptx,jpg,jpeg,png,gif,webp,zip,rar,txt,csv
app.storage.local.directorio=${STORAGE_DIR:uploads/planeaciones}
app.storage.local.crear-directorio=true
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.storage.cloudinary.secure=${CLOUDINARY_SECURE:true}
app.storage.cloudinary.timeout-ms=${CLOUDINARY_TIMEOUT_MS:5000}
app.storage.cloudinary.resource-type-por-defecto=raw
app.storage.cloudinary.carpeta-base=proyecto-global
# Tipo de entrega con el que se suben los archivos. "authenticated" deja el
# recurso protegido: sin URL firmada el CDN responde 401.
app.storage.cloudinary.tipo-entrega=${CLOUDINARY_TIPO_ENTREGA:authenticated}
# Vigencia (minutos) de las URLs firmadas de descarga.
app.storage.cloudinary.duracion-url-minutos=${STORAGE_URL_DURACION_MINUTOS:5}

# =====================================================================
# Integracion con Google Calendar (S3-03)
# =====================================================================
app.calendario.habilitado=${CALENDARIO_HABILITADO:false}
app.calendario.proveedor=${CALENDARIO_PROVEEDOR:google}
app.calendario.calendario-id=${GOOGLE_CALENDAR_ID:primary}
app.calendario.zona-horaria=${GOOGLE_CALENDAR_TIMEZONE:America/Mexico_City}
app.calendario.recordatorio-minutos=${GOOGLE_CALENDAR_REMINDER_MINUTES:1440}
app.calendario.dias-vigencia=${GOOGLE_CALENDAR_DIAS_VIGENCIA:180}
app.calendario.url-api=${GOOGLE_CALENDAR_API_URL:https://www.googleapis.com/calendar/v3}
app.calendario.url-token=${GOOGLE_CALENDAR_TOKEN_URL:https://oauth2.googleapis.com/token}
app.calendario.google.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.calendario.google.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.calendario.google.scope=${GOOGLE_CALENDAR_SCOPE:openid,email,https://www.googleapis.com/auth/calendar.events}
app.calendario.google.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:postmessage}

# =====================================================================
# Política de retención y minimización de datos (S3-07)
# =====================================================================
app.retencion.habilitado=${RETENCION_HABILITADO:false}
app.retencion.cron=${RETENCION_CRON:0 0 2 * * *}
app.retencion.dias-inactividad-usuario=${RETENCION_DIAS_INACTIVIDAD_USUARIO:730}
app.retencion.dias-eliminacion-archivos=${RETENCION_DIAS_ELIMINACION_ARCHIVOS:365}
app.retencion.dias-limpieza-revisiones=${RETENCION_DIAS_LIMPIEZA_REVISIONES:1095}
app.retencion.dominio-anonimizado=${RETENCION_DOMINIO_ANONIMIZADO:anon.local}

