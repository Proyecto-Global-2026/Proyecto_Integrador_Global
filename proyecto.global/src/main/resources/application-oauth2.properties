# =====================================================================
# Perfil de login alterno via OAuth2.
# Activar con:  --spring.profiles.active=default,oauth2
# Requiere registrar la app en Google Cloud Console.
# =====================================================================
app.oauth2.enabled=true

spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.provider.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.provider.google.user-name-attribute=email