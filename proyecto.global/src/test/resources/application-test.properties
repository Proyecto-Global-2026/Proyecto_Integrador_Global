# Perfil de pruebas: no toca la base de datos real ni aplica migraciones.
spring.datasource.url=jdbc:h2:mem:proyecto_global_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.cors.allowed-origins=http://localhost:5173

logging.level.root=WARN
logging.level.com.example.proyecto.global=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN